name: Ansible Deploy

on:
  pull_request:
    paths:
      - 'ansible/**'
  push:
    branches: [main]
    paths:
      - 'ansible/**'
  workflow_dispatch:

jobs:
  ansible:
    runs-on: ubuntu-latest
    env:
      TAILNET_DOMAIN: ${{ secrets.TAILNET_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY_CI }}
          tags: tag:ci

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_SSH_PRIVKEY }}

      - name: Disable strict host key checking
        run: echo "StrictHostKeyChecking no" >> ~/.ssh/config
      
      - name: Fetch Terraform outputs
        run: |
          OUTPUTS=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TFC_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            https://app.terraform.io/api/v2/workspaces/ws-xxxxxxxx/current-state-version-outputs)
          echo "HCLOUD_VOLUME_ID=$(echo $OUTPUTS | jq -r '.data[] | select(.attributes.name=="data_volume_id") | .attributes.value')" >> "$GITHUB_ENV"

      - name: Install Ansible
        run: pip install ansible

      - name: Run site.yml (check mode)
        if: github.event_name == 'pull_request'
        working-directory: ansible
        run: ansible-playbook site.yml --check --diff

      - name: Run site.yml
        if: github.event_name == 'push'
        working-directory: ansible
        run: ansible-playbook site.yml