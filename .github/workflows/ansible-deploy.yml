name: Ansible Deploy

on:
  pull_request:
    paths:
      - 'ansible/**'
  push:
    branches: [main]
    paths:
      - 'ansible/**'
  workflow_dispatch:

env:
  TAILNET_DOMAIN: ${{ secrets.TAILNET_DOMAIN }}
  PROJ_SERVER_DOMAIN: ${{ vars.PROJ_SERVER_DOMAIN }}
  TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
  GH_APP_ID: ${{ secrets.GH_APP_ID }}
  GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
  GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
  MLFLOW_BASIC_AUTH_USER: ${{ secrets.MLFLOW_BASIC_AUTH_USER }}
  MLFLOW_BASIC_AUTH_PASSWORD: ${{ secrets.MLFLOW_BASIC_AUTH_PASSWORD }}

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY_CI }}
          tags: tag:ci

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_SSH_PRIVKEY }}

      - name: Disable strict host key checking
        run: echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Fetch Terraform outputs
        run: |
          OUTPUTS=$(curl -s \
            --header "Authorization: Bearer $TFC_TOKEN" \
            --header "Content-Type: application/vnd.api+json" \
            https://app.terraform.io/api/v2/workspaces/${{ secrets.TFC_WORKSPACE_ID }}/current-state-version-outputs)
          echo "DATA_VOLUME_DEVICE=$(echo $OUTPUTS | jq -r '.data[] | select(.attributes.name=="data_volume_device") | .attributes.value')" >> "$GITHUB_ENV"

      - name: Install Ansible
        run: pip install ansible

      - name: Run site.yml (check mode)
        if: github.event_name == 'pull_request'
        working-directory: ansible
        run: ansible-playbook site.yml --check --diff

      - name: Run site.yml
        if: github.event_name == 'push'
        working-directory: ansible
        run: ansible-playbook site.yml