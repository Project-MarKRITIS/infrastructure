- name: Install k3s
  hosts: k3s_master
  become: true
  tasks:
    - name: Install k3s (server/master)
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL=stable sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Fetch kubeconfig
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./kubeconfig
        flat: true
    
    - name: Point local-path-provisioner to data volume
      command: >
        kubectl -n kube-system patch configmap local-path-config
        --type merge -p '{"data":{"config.json":"{\"nodePathMap\":[{\"node\":\"DEFAULT_PATH_FOR_NON_LISTED_NODES\",\"paths\":[\"/mnt/data\"]}]}"}}'
      register: storage_patch
      changed_when: "'not patched' not in storage_patch.stdout"