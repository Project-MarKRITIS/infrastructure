- name: Mount data volume
  hosts: k3s_master
  become: true
  tasks:
    - name: Check if volume is formatted
      command: blkid /dev/disk/by-id/scsi-0HC_Volume_{{ HCLOUD_VOLUME_ID }}
      register: blkid_check
      failed_when: false
      changed_when: false

    - name: Create mount point
      file:
        path: /mnt/data
        state: directory

    - name: Mount volume
      mount:
        path: /mnt/data
        src: /dev/disk/by-id/scsi-0HC_Volume_{{ HCLOUD_VOLUME_ID }}
        fstype: ext4
        state: mounted