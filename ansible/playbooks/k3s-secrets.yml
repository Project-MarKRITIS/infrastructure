- name: Apply Kubernetes secrets
  hosts: k3s_master
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Ensure arc-runners namespace exists
      shell: |
        kubectl create namespace arc-runners --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Write GitHub App private key to temp file
      copy:
        content: "{{ lookup('env', 'GH_APP_PRIVATE_KEY') }}"
        dest: /tmp/gh-app-key.pem
        mode: '0600'
      no_log: true

    - name: Apply arc-github-app-secret
      shell: |
        kubectl create secret generic arc-github-app-secret \
          --namespace=arc-runners \
          --from-literal=github_app_id="{{ lookup('env', 'GH_APP_ID') }}" \
          --from-literal=github_app_installation_id="{{ lookup('env', 'GH_APP_INSTALLATION_ID') }}" \
          --from-file=github_app_private_key=/tmp/gh-app-key.pem \
          --dry-run=client -o yaml | kubectl apply -f -
      register: secret_apply
      changed_when: "'configured' in secret_apply.stdout or 'created' in secret_apply.stdout"
      no_log: true

    - name: Remove temp private key file
      file:
        path: /tmp/gh-app-key.pem
        state: absent