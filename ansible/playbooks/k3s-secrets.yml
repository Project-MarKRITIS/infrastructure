- name: Apply Kubernetes secrets
  hosts: k3s_master
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Ensure arc-runners namespace exists
      shell: |
        kubectl create namespace arc-runners --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Write GitHub App private key to temp file
      copy:
        content: "{{ lookup('env', 'GH_APP_PRIVATE_KEY') }}"
        dest: /tmp/gh-app-key.pem
        mode: '0600'
      no_log: true

    - name: Apply arc-github-app-secret
      shell: |
        kubectl create secret generic arc-github-app-secret \
          --namespace=arc-runners \
          --from-literal=github_app_id="{{ lookup('env', 'GH_APP_ID') }}" \
          --from-literal=github_app_installation_id="{{ lookup('env', 'GH_APP_INSTALLATION_ID') }}" \
          --from-file=github_app_private_key=/tmp/gh-app-key.pem \
          --dry-run=client -o yaml | kubectl apply -f -
      register: secret_apply
      changed_when: "'configured' in secret_apply.stdout or 'created' in secret_apply.stdout"
      no_log: true

    - name: Remove temp private key file
      file:
        path: /tmp/gh-app-key.pem
        state: absent
    
    - name: Ensure mlflow namespace exists
      shell: |
        kubectl create namespace mlflow --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Apply mlflow-secrets
      shell: |
        kubectl create secret generic mlflow-secrets \
          --namespace=mlflow \
          --from-literal=postgres-user="{{ lookup('env', 'POSTGRES_USER') }}" \
          --from-literal=postgres-password="{{ lookup('env', 'POSTGRES_PASSWORD') }}" \
          --from-literal=s3-access-key="{{ lookup('env', 'S3_ACCESS_KEY') }}" \
          --from-literal=s3-secret-key="{{ lookup('env', 'S3_SECRET_KEY') }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: mlflow_secret_apply
      changed_when: "'configured' in mlflow_secret_apply.stdout or 'created' in mlflow_secret_apply.stdout"
      no_log: true
    
    - name: Apply mlflow-domains configmap
      shell: |
        kubectl create configmap mlflow-domains \
          --namespace=mlflow \
          --from-literal=tailnet-domain="{{ lookup('env', 'TAILNET_DOMAIN') }}" \
          --from-literal=proj-server-domain="{{ lookup('env', 'PROJ_SERVER_DOMAIN') }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: domains_cm_apply
      changed_when: "'configured' in domains_cm_apply.stdout or 'created' in domains_cm_apply.stdout"

    - name: Ensure apache2-utils is installed
      apt:
        name: apache2-utils
        state: present

    - name: Apply mlflow-basicauth-secret
      shell: |
        kubectl create secret generic mlflow-basicauth-secret \
          --namespace=mlflow \
          --from-literal=users="$(htpasswd -nbB '{{ lookup("env", "MLFLOW_BASIC_AUTH_USER") }}' '{{ lookup("env", "MLFLOW_BASIC_AUTH_PASSWORD") }}')" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: basicauth_apply
      changed_when: "'configured' in basicauth_apply.stdout or 'created' in basicauth_apply.stdout"
      no_log: true