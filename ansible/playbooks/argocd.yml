- name: Install ArgoCD
  hosts: k3s_master
  become: true
  vars:
    argocd_version: "v3.5.2"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Ensure argocd namespace exists
      shell: |
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Apply ArgoCD install manifest
      command: >
        kubectl apply -n argocd --server-side --force-conflicts
        -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
      register: argocd_apply
      changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout"

    - name: Wait for Application CRD to be established
      command: kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=60s
      changed_when: false

    - name: Disable internal TLS on argocd-server
      command: >
        kubectl -n argocd patch configmap argocd-cmd-params-cm
        --type merge -p '{"data":{"server.insecure":"true"}}'
      register: insecure_patch
      changed_when: "'not patched' not in insecure_patch.stdout"

    - name: Restart argocd-server to apply config
      command: kubectl -n argocd rollout restart deployment argocd-server
      when: insecure_patch.changed
      changed_when: true
    
    - name: Patch argocd-server service to NodePort
      command: kubectl -n argocd patch svc argocd-server -p '{"spec":{"type":"NodePort"}}'
      register: svc_patch
      changed_when: "'not patched' not in svc_patch.stdout"

    - name: Get argocd-server NodePort
      command: kubectl -n argocd get svc argocd-server -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}'
      register: argocd_nodeport
      changed_when: false

    - name: Configure tailscale serve for ArgoCD
      command: tailscale serve --bg http://localhost:{{ argocd_nodeport.stdout }}
      register: serve_config
      changed_when: "'Available within' in serve_config.stdout"

    - name: Apply root Application
      command: kubectl apply -f https://raw.githubusercontent.com/Project-MarKRITIS/platform/main/root-app.yaml
      register: root_app_apply
      changed_when: "'configured' in root_app_apply.stdout or 'created' in root_app_apply.stdout"